<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Verification OTP</title>
  </head>
  <body style="margin:0;padding:0;background:#f5f5f5;font-family:Arial,Helvetica,sans-serif;color:#222;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f5f5;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border-radius:8px;padding:32px;">
            <tr>
              <td>
                <h2 style="margin:0 0 16px;font-size:22px;font-weight:700;">Email Verification</h2>
                <p style="margin:0 0 12px;font-size:15px;line-height:1.5;">Hello,</p>
                <p style="margin:0 0 16px;font-size:15px;line-height:1.5;">
                  Your One-Time Password (OTP) is:
                </p>
                <p style="margin:0 0 20px;font-size:32px;font-weight:700;letter-spacing:6px;text-align:center;">
                  {{ otp }}
                </p>
                <p style="margin:0 0 12px;font-size:15px;line-height:1.5;">
                  Please use this OTP to verify your email address.
                </p>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.5;">
                  This OTP is valid for <strong>{{ minutes }} minutes</strong>.
                </p>
                <p style="margin:0 0 24px;font-size:14px;line-height:1.5;color:#555;">
                  If you did not request this verification, please ignore this email.
                </p>
                <p style="margin:0;font-size:15px;line-height:1.5;">Thank you.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
